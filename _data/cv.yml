  sections:
    Research Interests:
      - name: Multimodal Learning for Predictive Physical Interaction Understanding
        summary: >
          Developing multimodal models that reason about how agents interact with
          objects and anticipate the physical consequences of their actions.
          Building on temporal action analysis, vision–language retrieval, and
          domain generalization, I aim to learn transferable representations of
          motion, object states, and interaction context from multimodal
          observations — to support reliable decision-making in dynamic,
          real-world environments.

