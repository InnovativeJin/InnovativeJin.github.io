    Research Experience:
      - position: Student Researcher
        institution: Visual Intelligence Group, KIST
        location: Seoul, Republic of Korea
        start_date: 2026-08
        end_date: Present
        name: Robust Text-to-Image Person Re-Identification for Real-World Search
        highlights:
          - Investigating text-based person retrieval for missing-person and suspect searches where reference images are unavailable and only natural-language descriptions may be provided.

      - position: Student Researcher
        institution: Visual Intelligence Group, KIST
        location: Seoul, Republic of Korea
        start_date: 2026-04
        end_date: 2026-06
        name: Multimodal Human Proficiency Estimation (SkillLens)
        highlights:
          - Contributed core ideas and experimental design for action-guided Prototype Dynamics Margin (PDM) and CORAL-based ordinal calibration.
          - The proposed framework achieved **54.2%** accuracy on Ego-Exo4D, outperforming the strongest evaluated prior baseline (50.1%) by **4.1 percentage points**.

      - position: Student Researcher
        institution: Visual Intelligence Group, KIST
        location: Seoul, Republic of Korea
        start_date: 2026-03
        end_date: Present
        name: Federated Domain Generalization for Person Re-Identification
        highlights:
          - Investigated cross-domain generalization conflicts in federated person re-identification, motivated by scaling a deployed missing-person search system across heterogeneous municipal surveillance environments.
          - Developed identity-ranking-based diagnostics and evaluated the effects of client updates on unseen-domain retrieval through leave-one-client-out experiments.

      - position: Student Researcher
        institution: Visual Intelligence Group, KIST
        location: Seoul, Republic of Korea
        start_date: 2025-12
        end_date: 2026-03
        name: Pose-Robust Representation Learning for Person Re-Identification
        highlights:
          - Designed and implemented *SwapMixer*, a generation-free feature-level augmentation method that combines identity representations with pose embeddings from different identities.

      - position: Undergraduate Researcher
        institution: Yonsei University
        location: Seoul, Republic of Korea
        start_date: 2024-08
        end_date: 2024-12
        name: Knowledge Distillation for Open-Vocabulary Object Detection
        highlights:
          - Analyzed BARON's contrastive learning framework and identified a mismatch between teacher and student similarity structures for bags of regions sampled around the same region proposal.
          - Applied similarity-preserving knowledge distillation to align teacher–student relational representations, improving novel-class box AP50 on COCO by **+1.2 points** (23.1 → 24.3).

