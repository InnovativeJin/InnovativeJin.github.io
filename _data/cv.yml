  summary: >
    M.S. candidate in the YU–KIST cooperative graduate program, jointly advised by
    Dr. Heeseung Choi (KIST) and Prof. Bumsub Ham (Yonsei). Research focuses on
    multimodal learning for predictive physical interaction understanding —
    temporal action analysis, vision–language retrieval, and domain generalization.

